<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbita</title>
<meta name="apple-mobile-web-app-title" content="Orbita">
<meta name="theme-color" content="#0F1524">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0F1524;color:#E6EAF2;font:16px/1.4 -apple-system,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;box-sizing:border-box;text-align:center}
  img{width:88px;height:88px;border-radius:22px}
  a{display:inline-block;padding:12px 22px;border-radius:999px;background:#7C8CFF;color:#0F1524;font-weight:600;text-decoration:none}
  p{margin:0;color:#9AA4B8;max-width:22em}
</style>
</head>
<body>
<main>
  <img src="icona-192.png" alt="">
  <p id="msg">Apro Orbita…</p>
  <a id="go" href="#">Apri Orbita</a>
</main>
<script>
  // Pagina di lancio: serve solo a dare l'icona di Orbita sulla schermata Home dell'iPhone.
  // Non contiene dati: porta all'app web, che si apre solo con il tuo account Google.
  var APP = "INCOLLA_QUI_IL_TUO_URL_EXEC";
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP);
  document.getElementById("go").href = ok ? APP : "#";
  if(!ok) document.getElementById("msg").textContent = "Manca l'indirizzo dell'app: va incollato in index.html.";
  // ?resta: modalità installazione. Tolgo il parametro dall'indirizzo, così l'icona salvata punta alla pagina "pulita"
  // che, aperta dalla Home, porta subito all'app.
  else if(/[?&]resta\b/.test(location.search)){
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
    document.getElementById("msg").innerHTML = "Ora tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>. Dall'icona Orbita si aprirà direttamente.";
  }
  else setTimeout(function(){ location.replace(APP); }, 150);
</script>
</body>
</html>
